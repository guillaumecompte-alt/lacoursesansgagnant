<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La course sans gagnant</title>
<meta name="description" content="Faire arriver 3 voiturettes en même temps en jouant sur les délais ou les positions de départ.">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237c6cff'/%3E%3Cpath d='M27 30h20v20H27zM53 30h20v20H53zM27 56h20v20H27zM53 56h20v20H53z' fill='white'/%3E%3C/svg%3E">
<style>
  /* Charte graphique alignée sur le portail outilotheque.fr */
  :root {
    color-scheme: dark;
    --bg: #0b1020; --fg: #f4f5ff; --muted: #a1a9c4; --faint: #737e9f;
    --panel-border: rgba(164, 176, 220, .13);
    --primary: #9586ff; --primary-strong: #7665e6; --teal: #69d9c3;
    --secondary: #1a2240; --border: rgba(166, 178, 222, .16);
    --track: #161e38; --track-line: #c9cfe6; --ruler: #121a31;
    --car-1: #ff6b6b; --car-2: #5aa8ff; --car-3: #5fd38d;
    --car-4: #ffcf5c; --car-5: #b78cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--fg); overflow-x: hidden; letter-spacing: -.01em;
    background: radial-gradient(ellipse at 50% -20%, rgba(91, 77, 187, .18), transparent 48%), var(--bg);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .ambient { position: fixed; pointer-events: none; filter: blur(90px); opacity: .12; z-index: -1; border-radius: 50%; }
  .ambient-one { width: 340px; height: 340px; background: #6f59ff; top: 220px; left: -180px; }
  .ambient-two { width: 300px; height: 300px; background: #22c8b0; top: 560px; right: -170px; opacity: .07; }

  .topbar { height: 76px; border-bottom: 1px solid rgba(174,185,226,.1); display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(16px, 6vw, 90px); background: rgba(9,14,29,.68); backdrop-filter: blur(20px); }
  .brand { display: flex; align-items: center; gap: 11px; color: var(--fg); text-decoration: none; font-weight: 850; font-size: 14px; letter-spacing: .13em; }
  .brand-dot { color: var(--primary); }
  .brand-mark { width: 29px; height: 29px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: 9px;
    background: linear-gradient(140deg, #a89bff, #6957e8); box-shadow: 0 4px 20px #7563ff33; }
  .brand-mark span { background: white; border-radius: 2px; opacity: .95; }
  .brand-mark span:nth-child(2), .brand-mark span:nth-child(3) { opacity: .62; }
  .back { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #dedaff; background: #7b6ae626;
    border: 1px solid #9687ff30; border-radius: 8px; padding: 8px 10px; font-size: 11px; font-weight: 800; transition: .18s ease; }
  .back:hover { background: #8c7aff3d; color: white; }

  main { max-width: 1190px; width: calc(100% - 32px); margin: 0 auto; padding: 48px 0 56px; }
  header.hero { margin-bottom: 28px; }
  .eyebrow { display: flex; align-items: center; gap: 10px; color: #aaa0ff; font-size: 10px; font-weight: 800; letter-spacing: .2em; }
  .eyebrow-line { display: inline-block; height: 1px; width: 24px; background: var(--primary); }
  h1 { margin: 18px 0 14px; font-size: clamp(36px, 6vw, 64px); line-height: 1; letter-spacing: -.06em; font-weight: 780; }
  h1 span { background: linear-gradient(100deg, #a99eff 5%, #7dcbdf 95%); color: transparent; background-clip: text; -webkit-background-clip: text; }
  header.hero p { color: var(--muted); margin: 0; font-size: 15px; line-height: 1.7; max-width: 560px; }

  button { font: inherit; color: #c9cfe6; border: 1px solid transparent; cursor: pointer; border-radius: 8px; background: transparent;
    padding: 6px 10px; font-size: 12px; font-weight: 650; transition: .18s ease; }
  button:hover:not(:disabled) { color: #fff; background: var(--secondary); }
  button:disabled { opacity: .45; cursor: default; }
  .pill { padding: 10px 18px; font-weight: 750; font-size: 13px; border-color: var(--border); background: rgba(19,26,46,.82); }
  .on { color: #e8e5ff; background: #7665e624; border-color: #8e7cff66; }
  .row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
  .center { justify-content: center; }
  #games { justify-content: flex-start; }
  #games .pill { letter-spacing: .14em; font-size: 11px; font-weight: 800; }

  .card { position: relative; overflow: hidden; border: 1px solid var(--panel-border); border-radius: 15px; padding: 20px;
    background: linear-gradient(145deg, rgba(25,33,57,.92), rgba(15,21,39,.92)); margin-bottom: 20px; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: var(--primary); opacity: .8; }
  .card h2 { font-size: 16px; letter-spacing: -.03em; margin: 0 0 14px; font-weight: 750; }
  .chip { display: flex; align-items: center; gap: .55rem; border: 1px solid var(--border); background: rgba(19,26,46,.6);
    border-radius: 10px; padding: 9px 12px; opacity: .65; color: var(--fg); font-size: 13px; }
  .chip.sel { border-color: #8e7cff80; background: #7665e61f; opacity: 1; box-shadow: 0 0 0 3px #8170ed14; }
  .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
  small { color: var(--faint); font-size: 11px; }
  input { font: inherit; color: var(--fg); border: 1px solid var(--border); border-radius: 7px; padding: 4px 7px; background: rgba(19,26,46,.82); font-size: 13px; }
  input:focus { outline: 0; border-color: #8273ee; box-shadow: 0 0 0 3px #8170ed1c; }
  .toolbar-row { justify-content: space-between; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid #aeb9e214; font-size: 13px; }
  #boosts { color: var(--muted); }

  .race { display: flex; gap: .75rem; }
  .labels { width: 11rem; flex-shrink: 0; padding-top: .5rem; }
  .label { height: 4rem; margin-bottom: .5rem; display: flex; flex-direction: column; justify-content: center; gap: 2px; font-size: 13px; }
  .label strong { font-weight: 700; }
  .label input[type=number] { width: 4.5rem; }
  .label input[type=range] { accent-color: var(--primary); padding: 0; border: 0; background: transparent; }
  .trackwrap { flex: 1; position: relative; margin-left: 68px; padding-right: 4rem; }
  .track { position: relative; background: var(--track); border: 1px solid var(--panel-border); border-radius: 12px; padding: .5rem 0; }
  .lane { position: relative; height: 4rem; margin-bottom: .5rem; border-bottom: 1px dashed rgba(201,207,230,.16); }
  .lane:last-child { margin-bottom: 0; border: 0; }
  .finish { position: absolute; top: 0; bottom: 0; left: 100%; width: .5rem;
    background-image: repeating-conic-gradient(var(--track-line) 0 25%, var(--track) 0 50%); background-size: 8px 8px; }
  .car { position: absolute; top: 50%; transform: translateY(-50%); width: 64px; height: 32px; filter: drop-shadow(0 4px 8px #0006); }
  .offset-line { position: absolute; top: .25rem; left: 0; height: 2px; background: var(--teal); }
  .offset-tag { position: absolute; top: .4rem; background: var(--teal); color: #0b1020; font-size: 11px; font-weight: 800; padding: 0 .3rem; border-radius: 4px; }
  .ruler { position: relative; height: 2.5rem; margin-top: .4rem; background: var(--ruler); border: 1px solid var(--panel-border); border-radius: 8px; }
  .tick { position: absolute; top: 0; width: 1px; height: .5rem; background: #7582a8; }
  .tick.major { height: 1rem; background: #c9cfe6; }
  .tick span { position: absolute; top: 1rem; transform: translateX(-50%); font-size: 10px; font-weight: 650; color: var(--muted); }
  .unit { position: absolute; right: -3.5rem; top: .75rem; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .08em; }
  .go { background: var(--primary-strong); border-color: transparent; color: white; font-size: 15px; padding: 12px 28px; box-shadow: 0 8px 24px #7563ff40; }
  .go:hover:not(:disabled) { background: #8573f2; }
  .timer { width: 7.5rem; font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; color: #dedaff; }
  .result { margin-top: 18px; background: rgba(19,26,46,.82); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px; text-align: center; }
  .result p { font-size: 17px; font-weight: 750; margin: 0 0 .5rem; letter-spacing: -.02em; }
  .result.win { border-color: #69d9c366; box-shadow: 0 0 0 3px #69d9c314; }
  .result ul { list-style: none; padding: 0; margin: 0; font-size: 13px; color: var(--muted); line-height: 1.7; }

  @keyframes blink { 50% { opacity: .15; transform: translateY(-50%) scale(1.15); } }
  .blink { animation: blink .45s ease-in-out infinite; }
  @keyframes fall { from { transform: translate3d(0,-10vh,0) rotate(0); } to { transform: translate3d(var(--dx),110vh,0) rotate(720deg); opacity: .8; } }
  .confetti { position: fixed; top: 0; width: 10px; height: 16px; border-radius: 2px; pointer-events: none; z-index: 50;
    animation: fall var(--dur) cubic-bezier(.3,.6,.5,1) forwards; }

  @media (max-width: 600px) {
    main { padding-top: 32px; }
    .back span { display: none; }
    .race { flex-direction: column; }
    .labels { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; padding: 0; }
    .label { height: auto; }
    .trackwrap { padding-right: 2.5rem; }
    .unit { right: -2.2rem; }
  }
</style>
</head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<div class="topbar">
  <a class="brand" href="https://outilotheque.fr/" aria-label="Retour au portail">
    <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
    <span>LE HUB<span class="brand-dot">.</span></span>
  </a>
  <a class="back" href="https://outilotheque.fr/">← <span>Tous les outils</span></a>
</div>
<main>
  <header class="hero">
    <div class="eyebrow"><span class="eyebrow-line"></span> VITESSE &amp; PROPORTIONNALITÉ</div>
    <h1>La course<br><span>sans gagnant.</span></h1>
    <p>Le but : faire arriver les 3 voiturettes en même temps !</p>
  </header>

  <div class="row" id="games" style="margin-bottom:20px"></div>

  <section class="card">
    <h2 id="colorsTitle"></h2>
    <div class="row" id="colors"></div>
  </section>

  <section class="card" id="board" hidden>
    <div class="row toolbar-row">
      <div class="row" style="gap:.5rem">
        <strong>Longueur de piste :</strong>
        <input id="length" type="number" min="1" max="200" step="0.1" style="width:5rem"> cm
      </div>
      <div class="row" style="gap:.4rem" id="boosts">Vitesse d'affichage :</div>
    </div>

    <div class="race">
      <div class="labels" id="labels"></div>
      <div class="trackwrap">
        <div class="track" id="track"></div>
        <div class="ruler" id="ruler"></div>
      </div>
    </div>

    <div class="row center" style="margin-top:1.5rem">
      <button class="pill go" id="start">Départ !</button>
      <button class="pill" id="reset">Remettre en place</button>
      <span class="timer" id="timer">⏱ 0,00 s</span>
    </div>
    <div class="result" id="result" hidden></div>
  </section>
</main>

<script>
// ===== Réglages : modifier ici les voiturettes (vitesses en cm/s) =====
const CARS = [
  { id: 1, name: "rouge",   color: "var(--car-1)", speed: 2.4 },
  { id: 2, name: "bleue",   color: "var(--car-2)", speed: 0.49 },
  { id: 3, name: "verte",   color: "var(--car-3)", speed: 1.22 },
  { id: 4, name: "jaune",   color: "var(--car-4)", speed: 3.2 },
  { id: 5, name: "violette", color: "var(--car-5)", speed: 0.8 },
];
const TOLERANCE = 0.2;   // écart maximal (s) pour considérer une arrivée simultanée
const MAX_LENGTH = 200;  // cm

// ===== État =====
const state = {
  game: 1,            // 1 = délais, 2 = positions de départ
  length: 14,         // cm
  selected: [1, 2, 3],
  delay: {},          // délai par id de voiturette
  offset: {},         // position de départ par id de voiturette
  t: 0, running: false, done: false, boost: 1,
};

const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("fr-FR", { maximumFractionDigits: 2 });
const pct = (cm) => (cm / state.length) * 100;
const cars = () => state.selected.map((id) => CARS.find((c) => c.id === id));
const idle = () => !state.running && state.t === 0;

// ===== Physique =====
function arrivals() {
  return cars().map((c) => state.game === 1
    ? (state.delay[c.id] || 0) + state.length / c.speed
    : Math.max(0, state.length - (state.offset[c.id] || 0)) / c.speed);
}
function endTime() {
  const a = arrivals(), min = Math.min(...a), max = Math.max(...a);
  // La course s'arrête dès qu'une voiturette arrive seule.
  return max - min > TOLERANCE ? min : max;
}
function position(c, t) {
  const p = state.game === 1
    ? Math.max(0, t - (state.delay[c.id] || 0)) * c.speed
    : (state.offset[c.id] || 0) + t * c.speed;
  return Math.min(state.length, p);
}
function tiedSet(t) {
  const a = arrivals(), tied = new Set();
  for (let i = 0; i < a.length; i++)
    for (let j = i + 1; j < a.length; j++)
      if (Math.abs(a[i] - a[j]) <= TOLERANCE && t >= Math.max(a[i], a[j])) { tied.add(i); tied.add(j); }
  return tied;
}

// ===== Dessin =====
const carSvg = (color) => `
  <svg viewBox="0 0 60 30" width="64" height="32" aria-hidden="true">
    <rect x="4" y="10" width="50" height="12" rx="5" fill="${color}"/>
    <path d="M16 10 L22 3 H38 L46 10 Z" fill="${color}"/>
    <path d="M24 5 H36 L41 10 H20 Z" fill="#d6e4ff" opacity=".9"/>
    <circle cx="16" cy="23" r="5" fill="#0a0f1e" stroke="#4a5578"/><circle cx="44" cy="23" r="5" fill="#0a0f1e" stroke="#4a5578"/>
    <circle cx="16" cy="23" r="2" fill="#ccc"/><circle cx="44" cy="23" r="2" fill="#ccc"/>
    <rect x="52" y="12" width="4" height="4" rx="1" fill="#fff3b0"/>
  </svg>`;

function renderSetup() {
  $("games").innerHTML = [1, 2].map((g) =>
    `<button class="pill ${state.game === g ? "on" : ""}" data-game="${g}">JEU ${g}</button>`).join("");

  $("colorsTitle").textContent = `Choisis 3 voiturettes (${state.selected.length}/3)`;
  $("colors").innerHTML = CARS.map((c) => {
    const k = state.selected.indexOf(c.id);
    return `<button class="chip ${k >= 0 ? "sel" : ""}" data-car="${c.id}" ${idle() ? "" : "disabled"}>
      <span class="dot" style="background:${c.color}"></span>${c.name}
      <small>${fmt(c.speed)} cm/s${k >= 0 ? ` · n°${k + 1}` : ""}</small></button>`;
  }).join("");

  const ready = state.selected.length === 3;
  $("board").hidden = !ready;
  if (!ready) return;

  $("length").value = state.length;
  $("length").disabled = !idle();
  $("boosts").innerHTML = "Vitesse d'affichage : " + [1, 2, 5].map((b) =>
    `<button data-boost="${b}" class="${state.boost === b ? "on" : ""}">×${b}</button>`).join("");

  $("labels").innerHTML = cars().map((c, i) => `
    <div class="label">
      <strong>Voiturette n°${i + 1} (${c.name})</strong>
      <small>${fmt(c.speed)} cm/s</small>
      ${state.game === 1
        ? `<label>Délai <input type="number" min="0" step="0.1" data-delay="${c.id}" value="${state.delay[c.id] || 0}" ${idle() ? "" : "disabled"}> s</label>`
        : `<input type="range" min="0" max="${state.length}" step="0.01" data-offset="${c.id}" value="${state.offset[c.id] || 0}" ${idle() ? "" : "disabled"}>`}
    </div>`).join("");

  renderTrack();
  $("start").disabled = state.running;
  renderFrame();
}

// Piste + règle (redessinées seules quand on déplace un curseur, pour ne pas casser le glisser)
function renderTrack() {
  $("track").innerHTML = `<div class="finish"></div>` + cars().map((c) => {
    const o = state.offset[c.id] || 0;
    const marker = state.game === 2 && o > 0
      ? `<div class="offset-line" style="width:${pct(o)}%"></div><span class="offset-tag" style="left:${pct(o)}%">${fmt(o)} cm</span>` : "";
    return `<div class="lane">${marker}<div class="car">${carSvg(c.color)}</div></div>`;
  }).join("");

  // Règle graduée
  const L = state.length;
  const major = L <= 20 ? 1 : L <= 50 ? 5 : 10;
  const minor = L <= 20 ? 0.5 : major / 5;
  let html = "";
  for (let k = 0; k * minor <= L + 1e-9; k++) {
    const x = +(k * minor).toFixed(2);
    const isMajor = Math.abs(x / major - Math.round(x / major)) < 1e-6;
    html += `<div class="tick ${isMajor ? "major" : ""}" style="left:${pct(x)}%">${isMajor ? `<span>${fmt(x)}</span>` : ""}</div>`;
  }
  $("ruler").innerHTML = html + `<span class="unit">cm</span>`;
}

function renderFrame() {
  const list = cars(), tied = tiedSet(state.t);
  document.querySelectorAll("#track .car").forEach((el, i) => {
    el.style.left = `calc(${pct(position(list[i], state.t))}% - 64px)`;
    el.classList.toggle("blink", tied.has(i));
  });
  $("timer").textContent = `⏱ ${state.t.toFixed(2).replace(".", ",")} s`;

  const res = $("result");
  res.hidden = !state.done;
  if (state.done) {
    const win = tied.size === 3, a = arrivals();
    res.classList.toggle("win", win);
    res.innerHTML = `<p>${win ? "🎉 Bravo ! Les 3 voiturettes arrivent ensemble !"
      : "Perdu ! Une voiturette a touché la ligne seule… essaie encore !"}</p>
      <ul>${list.map((c, i) => `<li>Voiturette n°${i + 1} (${c.name}) : arrivée à ${fmt(a[i])} s</li>`).join("")}</ul>`;
    if (win) confetti();
  }
}

function confetti() {
  for (let i = 0; i < 140; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.style.cssText = `left:${Math.random() * 100}%;background:${CARS[i % 5].color};animation-delay:${Math.random() * 0.8}s;--dx:${(Math.random() - 0.5) * 300}px;--dur:${2.5 + Math.random() * 2.5}s`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6000);
  }
}

// ===== Animation =====
let last = 0;
function loop(now) {
  if (!state.running) return;
  state.t += ((now - last) / 1000) * state.boost;
  last = now;
  const end = endTime();
  if (state.t >= end) {
    state.t = end; state.running = false; state.done = true;
    renderSetup();
    return;
  }
  renderFrame();
  requestAnimationFrame(loop);
}
function start() {
  state.t = 0; state.done = false; state.running = true;
  renderSetup();
  last = performance.now();
  requestAnimationFrame(loop);
}
function reset() {
  state.running = false; state.done = false; state.t = 0;
  renderSetup();
}

// ===== Événements =====
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.game) { state.game = +b.dataset.game; reset(); }
  else if (b.dataset.car && idle()) {
    const id = +b.dataset.car, s = state.selected;
    state.selected = s.includes(id) ? s.filter((x) => x !== id) : s.length < 3 ? [...s, id] : s;
    renderSetup();
  }
  else if (b.dataset.boost) { state.boost = +b.dataset.boost; renderSetup(); }
  else if (b.id === "start") start();
  else if (b.id === "reset") reset();
});

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.delay) { state.delay[el.dataset.delay] = Math.max(0, parseFloat(el.value) || 0); renderFrame(); }
  if (el.dataset.offset) {
    state.offset[el.dataset.offset] = +el.value;
    renderTrack();
    renderFrame();
  }
});

$("length").addEventListener("change", (e) => {
  const v = parseFloat(String(e.target.value).replace(",", "."));
  if (v > 0 && v <= MAX_LENGTH) {
    state.length = v;
    for (const id in state.offset) state.offset[id] = Math.min(state.offset[id], v);
  }
  reset();
});

renderSetup();
</script>
</body>
</html>
